name: "Continuous Integrations"

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    uses: ionic-team/.github/.github/workflows/reusable_lint.yml@ce76eaeebc6bb5bb0ddb2c88ada46f6d107a002d

  build:
    uses: ionic-team/.github/.github/workflows/reusable_build.yml@ce76eaeebc6bb5bb0ddb2c88ada46f6d107a002d

  verify-plugin-android:
    runs-on: 'macos-15'
    timeout-minutes: 30
    steps:
      - name: 'Setup Environment'
        id: setup
        uses: ionic-team/capacitor-actions/setup-tools@0593e5113cff6305d18e218c9d6768fd010406b4
        with:
          working-directory: ./packages/capacitor-plugin
          gh-token: ${{ github.token }}
      - name: 'Verify Android'
        working-directory: ./packages/capacitor-plugin
        run: npm run verify:android

  verify-plugin-ios:
    runs-on: 'macos-15'
    timeout-minutes: 30
    steps:
      - name: 'Setup Environment'
        id: setup
        uses: ionic-team/capacitor-actions/setup-tools@0593e5113cff6305d18e218c9d6768fd010406b4
        with:
          working-directory: ./packages/capacitor-plugin
          gh-token: ${{ github.token }}
      - name: 'Verify iOS'
        working-directory: ./packages/capacitor-plugin
        run: npm run verify:ios

  build-example-app-android:
    runs-on: 'macos-15'
    timeout-minutes: 30
    steps:
      - name: 'Setup Environment'
        id: setup
        uses: ionic-team/capacitor-actions/setup-tools@0593e5113cff6305d18e218c9d6768fd010406b4
        with:
          working-directory: ./packages/capacitor-plugin
          gh-token: ${{ github.token }}
      - name: 'Prepare example app'
        uses: ./.github/actions/prepare-example-app
      - name: 'Build Android example app'
        working-directory: ./packages/example-app/android
        run: ./gradlew clean assembleDebug
    
  build-example-app-ios:
    runs-on: 'macos-15'
    timeout-minutes: 30
    steps:
      - name: 'Setup Environment'
        id: setup
        uses: ionic-team/capacitor-actions/setup-tools@0593e5113cff6305d18e218c9d6768fd010406b4
        with:
          working-directory: ./packages/capacitor-plugin
          gh-token: ${{ github.token }}
      - name: 'Prepare example app'
        uses: ./.github/actions/prepare-example-app
      - name: 'Build iOS example app'
        working-directory: ./packages/example-app/ios/App
        run: xcodebuild clean build -workspace App.xcworkspace -scheme App CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
